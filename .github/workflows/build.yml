name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests (headless)
        run: |
          mkdir -p build/coretest
          find app/src/main/java/com/droidmaker/core -name '*.java' > build/core.txt
          set -o pipefail
          if ! (javac -d build/coretest @build/core.txt tools/coretest/CoreTest.java && java -cp build/coretest CoreTest) 2>&1 | tee build/tests.log; then
            grep -E "error|FAIL|Exception" build/tests.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build/gradle.log; then
            grep -E "error:|e: |What went wrong|FAILED|Exception|AAPT|resource" build/gradle.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk DroidMaker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DroidMaker-apk
          path: DroidMaker.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" DroidMaker.apk \
            --title "DroidMaker build ${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}. Download DroidMaker.apk below and open it on your phone to install." \
            --latest
